<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوقنا | حالة الدفع</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet"><style>body{font-family:Cairo,Arial;background:#f7f8ff;color:#17152a;margin:0;display:grid;place-items:center;min-height:100vh}.box{width:min(470px,88vw);background:#fff;padding:42px 28px;border-radius:24px;box-shadow:0 25px 70px #352a8522;text-align:center}.logo{font-size:27px;font-weight:800}.logo span{color:#6546e8}.icon{width:72px;height:72px;display:grid;place-items:center;border-radius:50%;margin:25px auto;font-size:33px;background:#e7fbf1;color:#25a86d}.pending{background:#fff6df;color:#cf9522}.failed{background:#fff0f0;color:#de5353}p{color:#747187;line-height:1.9;font-size:14px}a{display:inline-block;margin-top:10px;padding:11px 19px;border-radius:10px;background:#6546e8;color:#fff;text-decoration:none;font-size:13px;font-weight:700}</style></head><body><main class="box"><div class="logo">سوق<span>نا</span></div><div id="icon" class="icon">✓</div><h1 id="title">تم الدفع بنجاح</h1><p id="message">شكرًا لك. تم استلام عملية الدفع وسيتم تحديث طلبك تلقائيًا.</p><a href="/">العودة إلى سوقنا</a></main><script>const p=location.pathname;const icon=document.querySelector('#icon'),title=document.querySelector('#title'),msg=document.querySelector('#message');if(p.includes('pending')){icon.textContent='◷';icon.classList.add('pending');title.textContent='الدفع قيد المراجعة';msg.textContent='ننتظر تأكيد عملية الدفع. لا تعِد المحاولة الآن؛ سنتابع الحالة تلقائيًا.'}if(p.includes('failed')){icon.textContent='×';icon.classList.add('failed');title.textContent='لم تكتمل عملية الدفع';msg.textContent='لم يتم خصم أي مبلغ من خلال سوقنا. يمكنك مراجعة وسيلة الدفع أو المحاولة مرة أخرى.'}</script></body></html>
