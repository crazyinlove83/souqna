<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوقنا | لوحة التحكم</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Cairo,Arial;background:#f7f8ff;color:#17152b}.top{height:67px;padding:0 5%;background:#fff;border-bottom:1px solid #e9e7f1;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:800}.brand span{color:#6546e8}.user{font-size:13px;color:#77748f}.logout{border:0;background:#f1eff8;color:#6546e8;padding:8px 12px;border-radius:8px;font:inherit;cursor:pointer}.wrap{max-width:1100px;margin:44px auto;padding:0 24px}.eyebrow{color:#6546e8;font-size:12px;font-weight:700}h1{font-size:31px;margin:7px 0}p{color:#77748f;font-size:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:25px 0}.card{background:#fff;border:1px solid #e9e7f1;border-radius:15px;padding:19px}.card small{color:#77748f}.card strong{display:block;font-size:26px;margin-top:8px;color:#6546e8}.panel{background:#fff;border:1px solid #e9e7f1;border-radius:15px;padding:23px}.panel h2{font-size:17px;margin-top:0}.row{padding:13px 0;border-top:1px solid #f0eef5;font-size:13px;display:flex;justify-content:space-between}.empty{padding:30px;text-align:center;color:#77748f}@media(max-width:600px){.cards{grid-template-columns:1fr}.wrap{margin-top:28px}}</style></head><body><header class="top"><div class="brand">سوق<span>نا</span></div><div><span class="user" id="user"></span> <button class="logout" id="logout">تسجيل الخروج</button></div></header><main class="wrap"><span class="eyebrow" id="role"></span><h1 id="welcome">أهلًا بك</h1><p>هذه لوحة حسابك. ستظهر بيانات متجرك والرصيد تلقائيًا بعد بدء النشاط.</p><section class="cards"><article class="card"><small>الرصيد المتاح</small><strong id="balance">—</strong></article><article class="card"><small>المبيعات المدفوعة</small><strong id="sales">—</strong></article><article class="card"><small>الحالة</small><strong>نشط</strong></article></section><section class="panel"><h2>آخر النشاط</h2><div class="empty">لا توجد معاملات بعد. أضف متجرك ومنتجاتك لبدء البيع.</div></section></main><script>const token=localStorage.getItem('souqna_token'),user=JSON.parse(localStorage.getItem('souqna_user')||'null');if(!token||!user)location.replace('/login.html');document.querySelector('#user').textContent=user?.full_name||user?.name||'';document.querySelector('#welcome').textContent=`أهلًا ${user?.full_name||user?.name||''} 👋`;document.querySelector('#role').textContent=user?.role==='admin'?'لوحة الإدارة':user?.role==='seller'?'لوحة التاجر':'حساب العميل';document.querySelector('#logout').onclick=()=>{localStorage.removeItem('souqna_token');localStorage.removeItem('souqna_user');location.assign('/')};if(user?.role==='seller')fetch('/api/seller/dashboard',{headers:{Authorization:'Bearer '+token}}).then(r=>r.json()).then(r=>{if(r.data){document.querySelector('#balance').textContent=Number(r.data.available_balance).toLocaleString('ar-EG')+' ج.م';document.querySelector('#sales').textContent=Number(r.data.sales).toLocaleString('ar-EG')+' ج.م'}});</script></body></html>
